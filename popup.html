<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brunnr Extension</title>
  <style>
    body {
      width: 350px;
      min-height: 200px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 20px;
    }
    
    h1 {
      margin: 0 0 16px 0;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo {
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #667eea;
    }
    
    .status {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
    }
    
    .status-item {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 14px;
    }
    
    .status-label {
      opacity: 0.9;
    }
    
    .status-value {
      font-weight: 500;
    }
    
    .status-value.active {
      color: #86efac;
    }
    
    .status-value.inactive {
      color: #fca5a5;
    }
    
    .description {
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.9;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .button {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      transition: background 0.2s;
    }
    
    .button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span class="logo">B</span>
      Brunnr Extension
    </h1>
    
    <div id="loading" class="loading">Loading status...</div>
    
    <div id="content" style="display: none;">
      <div class="status">
        <div class="status-item">
          <span class="status-label">Status:</span>
          <span id="extension-status" class="status-value">-</span>
        </div>
        <div class="status-item">
          <span class="status-label">User Email:</span>
          <span id="user-email" class="status-value">-</span>
        </div>
        <div class="status-item">
          <span class="status-label">Session:</span>
          <span id="session-id" class="status-value">-</span>
        </div>
        <div class="status-item">
          <span class="status-label">Videos Injected:</span>
          <span id="video-count" class="status-value">-</span>
        </div>
      </div>
      
      <button id="clear-data" class="button">Clear Session Data</button>
      
      <div class="description">
        This extension enhances MathAcademy lessons with supplemental "Mastery in a Minute" videos for Grade 4 multiplication topics.
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
